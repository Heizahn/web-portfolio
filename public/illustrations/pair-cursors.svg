<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Programación en pareja con IA</title>
  <desc id="d">Un cursor humano y una chispa de IA editan juntos el mismo bloque de código.</desc>
  <!-- Forja · ilustración original de Heizahn, licencia CC0 -->
  <style>
    .sel{transform-box:fill-box;transform-origin:left center;animation:sel 6s ease-in-out infinite}
    @keyframes sel{0%,20%{transform:scaleX(0);opacity:0}35%,70%{transform:scaleX(1);opacity:1}85%,100%{transform:scaleX(1);opacity:0}}
    .human{animation:walk 6s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes walk{0%{transform:translate(0,0)}25%{transform:translate(118px,-8px)}50%{transform:translate(118px,44px)}75%{transform:translate(20px,60px)}100%{transform:translate(0,0)}}
    .ai{animation:orbit 6s cubic-bezier(.65,0,.35,1) infinite}
    @keyframes orbit{0%{transform:translate(0,0)}25%{transform:translate(-40px,52px)}50%{transform:translate(-110px,36px)}75%{transform:translate(-30px,-14px)}100%{transform:translate(0,0)}}
    .ai-star{transform-box:fill-box;transform-origin:center;animation:twinkle 1.2s ease-in-out infinite}
    @keyframes twinkle{0%{transform:rotate(0) scale(1)}50%{transform:rotate(45deg) scale(.7)}100%{transform:rotate(90deg) scale(1)}}
    .link{stroke-dasharray:4 6;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-20}}
    .diff{transform-box:fill-box;transform-origin:left center;animation:grow 6s ease-out infinite}
    .d2{animation-delay:.4s}
    @keyframes grow{0%,45%{transform:scaleX(0)}60%,90%{transform:scaleX(1)}100%{transform:scaleX(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect x="40" y="36" width="320" height="228" rx="16" fill="#151B2C" stroke="#3A4664" stroke-width="2"/>
  <g fill="#56627F">
    <rect x="70" y="66" width="18" height="8" rx="4"/><rect x="70" y="90" width="18" height="8" rx="4"/><rect x="70" y="114" width="18" height="8" rx="4"/><rect x="70" y="138" width="18" height="8" rx="4"/><rect x="70" y="162" width="18" height="8" rx="4"/><rect x="70" y="186" width="18" height="8" rx="4"/><rect x="70" y="210" width="18" height="8" rx="4"/>
  </g>
  <rect class="sel" x="104" y="108" width="190" height="44" rx="6" fill="#7AB2FF" fill-opacity=".18" stroke="#7AB2FF" stroke-opacity=".5"/>
  <rect x="106" y="66" width="120" height="8" rx="4" fill="#7AB2FF"/>
  <rect x="122" y="90" width="80" height="8" rx="4" fill="#B6BFCE"/><rect x="208" y="90" width="60" height="8" rx="4" fill="#FFD27A"/>
  <rect x="122" y="114" width="150" height="8" rx="4" fill="#B6BFCE"/>
  <rect x="122" y="138" width="96" height="8" rx="4" fill="#FF8A4C"/>
  <rect x="106" y="162" width="30" height="8" rx="4" fill="#B6BFCE"/>
  <rect class="diff" x="96" y="183" width="240" height="14" rx="4" fill="#3FD0B5" fill-opacity=".22"/>
  <rect class="diff" x="122" y="186" width="130" height="8" rx="4" fill="#3FD0B5"/>
  <rect class="diff d2" x="96" y="207" width="240" height="14" rx="4" fill="#3FD0B5" fill-opacity=".22"/>
  <rect class="diff d2" x="122" y="210" width="90" height="8" rx="4" fill="#3FD0B5"/>
  <text x="100" y="194" font-family="ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#3FD0B5">+</text>
  <text x="100" y="218" font-family="ui-monospace,Menlo,monospace" font-size="10" font-weight="700" fill="#3FD0B5">+</text>
  <path class="link" d="M150 100 Q220 40 300 76" fill="none" stroke="#FFD27A" stroke-width="1.5" stroke-opacity=".7"/>
  <g class="human">
    <path d="M140 92 l0 24 l6 -6 l5 11 l4 -2 l-5 -10 l8 0 z" fill="#3FD0B5" stroke="#0E1220" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="152" y="118" width="32" height="12" rx="6" fill="#3FD0B5"/>
    <text x="158" y="127" font-family="ui-monospace,Menlo,monospace" font-size="8" font-weight="700" fill="#0E1220">tú</text>
  </g>
  <g class="ai">
    <g transform="translate(300 76)">
      <circle r="16" fill="#FF8A4C" fill-opacity=".18"/>
      <path class="ai-star" d="M0 -12 C2 -3 3 -2 12 0 C3 2 2 3 0 12 C-2 3 -3 2 -12 0 C-3 -2 -2 -3 0 -12 Z" fill="#FFD27A" stroke="#FF8A4C" stroke-width="1.5"/>
    </g>
  </g>
</svg>
