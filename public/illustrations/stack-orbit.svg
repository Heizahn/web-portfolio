<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t d">
  <title id="t">Órbita del stack</title>
  <desc id="d">Un núcleo fundido con glifos de frontend, tipos, sistemas, runtime y datos girando a su alrededor.</desc>
  <!-- Forja · ilustración original de Heizahn, licencia CC0. Glifos genéricos, no logotipos. -->
  <defs>
    <radialGradient id="core" cx=".4" cy=".35" r=".7">
      <stop offset="0" stop-color="#FFF1D6"/><stop offset=".35" stop-color="#FFD27A"/><stop offset="1" stop-color="#FF8A4C"/>
    </radialGradient>
    <radialGradient id="aura" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FF8A4C" stop-opacity=".45"/><stop offset="1" stop-color="#FF8A4C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .spin{transform-origin:200px 150px;animation:spin 18s linear infinite}
    .spin.r{animation-duration:26s;animation-direction:reverse}
    .spin.s{animation-duration:34s}
    @keyframes spin{to{transform:rotate(360deg)}}
    .up{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite reverse}
    .r .up{animation-duration:26s;animation-direction:normal}
    .s .up{animation-duration:34s}
    .aura{transform-origin:200px 150px;animation:breathe 3s ease-in-out infinite}
    @keyframes breathe{50%{transform:scale(1.12);opacity:.7}}
    .star{transform-origin:200px 150px;animation:spin 9s linear infinite}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <circle class="aura" cx="200" cy="150" r="72" fill="url(#aura)"/>
  <g fill="none" stroke="#56627F" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round">
    <circle cx="200" cy="150" r="60"/><circle cx="200" cy="150" r="95"/><circle cx="200" cy="150" r="130"/>
  </g>
  <circle cx="200" cy="150" r="30" fill="url(#core)"/>
  <path class="star" d="M200 136 C202 146 204 148 214 150 C204 152 202 154 200 164 C198 154 196 152 186 150 C196 148 198 146 200 136 Z" fill="#5F230E"/>
  <!-- órbita 1: interfaz y tipos -->
  <g class="spin">
    <g transform="translate(260 150)"><g class="up"><circle r="14" fill="#151B2C" stroke="#7AB2FF" stroke-width="2"/><path d="M-4 -6 l-5 6 l5 6 M4 -6 l5 6 l-5 6" stroke="#7AB2FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>
    <g transform="translate(140 150)"><g class="up"><circle r="14" fill="#151B2C" stroke="#7AB2FF" stroke-width="2"/><text y="4" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" font-weight="800" fill="#7AB2FF">TS</text></g></g>
  </g>
  <!-- órbita 2: sistemas y runtime -->
  <g class="spin r">
    <g transform="translate(200 55)"><g class="up">
      <circle r="14" fill="#151B2C" stroke="#FF8A4C" stroke-width="2"/>
      <g fill="#FF8A4C"><circle r="5.5"/><rect x="-2" y="-9.5" width="4" height="5" rx="1"/><rect x="-2" y="4.5" width="4" height="5" rx="1"/><rect x="-9.5" y="-2" width="5" height="4" rx="1"/><rect x="4.5" y="-2" width="5" height="4" rx="1"/></g>
      <circle r="2.3" fill="#151B2C"/>
    </g></g>
    <g transform="translate(200 245)"><g class="up"><circle r="14" fill="#151B2C" stroke="#3FD0B5" stroke-width="2"/><path d="M0 -8 l7 4 v8 l-7 4 l-7 -4 v-8 z" fill="none" stroke="#3FD0B5" stroke-width="2.2" stroke-linejoin="round"/></g></g>
  </g>
  <!-- órbita 3: datos y bun -->
  <g class="spin s">
    <g transform="translate(330 150)"><g class="up"><circle r="14" fill="#151B2C" stroke="#B6BFCE" stroke-width="2"/><g fill="none" stroke="#B6BFCE" stroke-width="1.8"><ellipse cx="0" cy="-5" rx="6.5" ry="2.5"/><path d="M-6.5 -5 v10 a6.5 2.5 0 0 0 13 0 v-10 M-6.5 0 a6.5 2.5 0 0 0 13 0"/></g></g></g>
    <g transform="translate(70 150)"><g class="up"><circle r="14" fill="#151B2C" stroke="#FFD27A" stroke-width="2"/><path d="M-8 2.5 a8 6.5 0 0 1 16 0 a1.6 1.6 0 0 1 -1.6 1.6 h-12.8 a1.6 1.6 0 0 1 -1.6 -1.6z" fill="#FFD27A"/><circle cx="-2.5" cy="0" r="1" fill="#151B2C"/><circle cx="2.5" cy="0" r="1" fill="#151B2C"/></g></g>
    <g transform="translate(200 20)"><g class="up"><circle r="14" fill="#151B2C" stroke="#FF8A4C" stroke-width="2"/><path d="M0 -8 C1.3 -2 2 -1.3 8 0 C2 1.3 1.3 2 0 8 C-1.3 2 -2 1.3 -8 0 C-2 -1.3 -1.3 -2 0 -8 Z" fill="#FFD27A"/></g></g>
  </g>
</svg>
